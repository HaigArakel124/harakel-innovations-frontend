<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Sent before ANY subresource request is made. The reset token is still in the query
     string on first paint, and the Google Fonts stylesheet below is fetched before our
     script can strip it — without this, the token would leave in the Referer header. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harakel — Set a new password</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Lifted verbatim from client.html (lines 9-38) so this screen is indistinguishable
   from the login card it continues. Do not restyle in isolation — change both. */
:root {
  --bg:#0a0a0f; --surface:#111118; --surface2:#18181f; --surface3:#1e1e28;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --text:#f0f0f5; --text2:#9090a8; --text3:#5a5a72;
  --accent:#6c63ff; --accent2:#8b84ff; --accent-glow:rgba(108,99,255,0.18);
  --green:#00d9a3; --green-dim:rgba(0,217,163,0.12);
  --amber:#ffb547; --amber-dim:rgba(255,181,71,0.12);
  --pink:#ff6b9d; --pink-dim:rgba(255,107,157,0.12);
  --blue:#4da6ff; --blue-dim:rgba(77,166,255,0.12);
  --radius:14px; --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

#reset-screen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:400px;padding:40px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);}
.login-logo{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;}
.login-sub{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:28px;}
.modal-help{font-size:12px;color:var(--text3);line-height:1.5;margin-bottom:18px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:500;}
.form-group input{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.15s;}
.form-group input:focus{border-color:var(--accent);}
.btn{padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.btn-primary{background:var(--accent);color:#fff;width:100%;padding:12px;}
.btn-primary:hover{background:var(--accent2);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2);}
.btn-ghost:hover{background:var(--surface2);color:var(--text);}
.error-msg{background:rgba(255,107,157,0.1);border:1px solid rgba(255,107,157,0.3);color:var(--pink);font-size:13px;padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:16px;display:none;}
/* Anchor styled as a ghost button. Its href is a bare path — no token ever goes in a link. */
.back-link{display:block;width:100%;text-align:center;text-decoration:none;}
</style>
</head>
<body>

<div id="reset-screen">
  <div class="login-card">
    <div class="login-logo">Harakel</div>
    <div class="login-sub">Client Portal</div>

    <div class="error-msg" id="reset-error"></div>

    <!-- Hidden until init() confirms a token is present. A form that cannot possibly
         succeed is worse than no form at all, so it is never rendered without one. -->
    <form id="reset-form" style="display:none;" onsubmit="submitReset(event)">
      <div class="modal-help">Choose a new password for your account. You'll be signed in straight away.</div>
      <div class="form-group">
        <label>New password</label>
        <input type="password" id="new-password" placeholder="At least 8 characters, 1 letter, 1 number" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" id="confirm-password" required autocomplete="new-password">
      </div>
      <button class="btn btn-primary" type="submit" id="reset-btn" style="margin-top:8px;">Set new password</button>
    </form>

    <div id="back-link-row" style="display:none;margin-top:4px;">
      <a class="btn btn-ghost back-link" href="/client">Back to sign in</a>
    </div>
  </div>
</div>

<script>
var API = 'https://web-production-608a8.up.railway.app';   // same base URL client.html uses

// The reset token is a bearer credential. It lives in this one variable for the life of the
// page — never localStorage, never sessionStorage, never a link href, never logged.
var RESET_TOKEN = '';

// ── Inline error surface, matching client.html's .error-msg convention ──
function showError(msg, offerBackLink) {
  var el = document.getElementById('reset-error');
  el.textContent = msg;
  el.style.display = 'block';
  if (offerBackLink) document.getElementById('back-link-row').style.display = 'block';
}
function clearError() {
  document.getElementById('reset-error').style.display = 'none';
}

// ── Copied from client.html:482-498 ──
// Handles FastAPI's two shapes: {detail: "string"} and {detail: [{msg, loc, ...}]}.
function extractErrorMessage(payload, fallback) {
  if (!payload) return fallback;
  var d = payload.detail;
  if (typeof d === 'string') return d;
  if (Array.isArray(d) && d.length > 0) {
    var first = d[0];
    if (first && typeof first.msg === 'string') {
      // Prefix with the offending field name when available, e.g. "template: too long".
      var loc = Array.isArray(first.loc) ? first.loc.filter(function(x){return x !== 'body';}) : [];
      var field = loc.length ? loc[loc.length - 1] : null;
      return field ? field + ': ' + first.msg : first.msg;
    }
    if (typeof first === 'string') return first;
  }
  if (typeof payload.message === 'string') return payload.message;
  return fallback;
}

function submitReset(e) {
  e.preventDefault();
  clearError();
  var next    = document.getElementById('new-password').value;
  var confirm = document.getElementById('confirm-password').value;

  // Same two rules and byte-identical wording to client.html's change-password modal
  // (client.html:1324-1331). One rule must never produce two different messages.
  //
  // Validating before the network call matters more here than it does there: the backend's
  // rate-limit dependency runs BEFORE the handler, so every server-side rejection burns a
  // hit against this token's bucket. Catching a fumbled password in the browser means a
  // typo never costs the user their reset link.
  if (next.length < 8 || !/[A-Za-z]/.test(next) || !/\d/.test(next)) {
    showError('New password must be at least 8 characters and include a letter and a number.');
    return;
  }
  if (next !== confirm) {
    showError('New password and confirmation do not match.');
    return;
  }
  _doReset(next);
}

async function _doReset(next) {
  var btn = document.getElementById('reset-btn');
  btn.disabled = true; btn.textContent = 'Setting password...';
  try {
    // No Authorization header — the token in the body IS the credential.
    var res = await fetch(API + '/api/client-auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ token: RESET_TOKEN, new_password: next }),
    });

    if (res.status === 200) {
      var data = await res.json();
      if (!data.access_token) throw new Error('no session returned');
      localStorage.setItem('client_token', data.access_token);   // same key client.html reads
      window.location.href = '/client';                          // user lands already signed in
      return;                                                    // leave the button disabled
    }

    if (res.status === 400) {
      var err = await res.json().catch(function(){ return {}; });
      var detail = extractErrorMessage(err, 'Could not set your password. Please try again.');
      // Two unrelated failures arrive as 400: a password-policy message and a dead link.
      // Only the dead link is actionable by going back, so the link is gated on the wording.
      // Either way the server's text is shown verbatim — it is not rewritten here.
      showError(detail, /invalid|expired/i.test(detail));
    } else if (res.status === 429) {
      showError('Too many attempts. Please wait a few minutes and try again.');
    } else {
      showError('Something went wrong. Please try again.');
    }
  } catch (e) {
    // Deliberately not logged: this scope holds both the token and the new password.
    showError('Something went wrong. Please try again.');
  }
  btn.disabled = false; btn.textContent = 'Set new password';
}

(function init() {
  var token = new URLSearchParams(window.location.search).get('token');

  if (!token) {
    showError('This reset link is invalid. Please request a new one.', true);
    return;   // #reset-form stays display:none
  }

  RESET_TOKEN = token;

  // Strip the token from the address bar immediately. Left in the URL, a bearer credential
  // ends up in browser history, in any screenshot or screen-share of this page, and in the
  // Referer of every outbound request. After this line it exists only in memory.
  // Wrapped because replaceState throws on file:// — there the page still works, it just
  // keeps the visible URL. On any real deployment this always succeeds.
  try { history.replaceState({}, '', '/reset-password'); } catch (e) {}

  document.getElementById('reset-form').style.display = 'block';
  document.getElementById('new-password').focus();
})();
</script>
</body>
</html>
